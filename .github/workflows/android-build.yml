
name: Build Solara City Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Solara City for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Unity project
        shell: bash
        run: |
          mkdir -p project
          unzip -o SolaraCity_Unity6_Android-v2.zip -d project

          PROJECT_FILE=$(find project -name ProjectVersion.txt -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Unity ProjectVersion.txt not found."
            exit 1
          fi

          echo "UNITY_PROJECT_PATH=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: Android
          allowDirtyBuild: true
          buildsPath: build
          buildName: SolaraCity
          unityVersion: 6000.0.32f1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolaraCity-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
